name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.toolchain == 'stable' && 'rustfmt, clippy' || '' }}
      - name: Formatting
        if: matrix.toolchain == 'stable'
        run: |
          cargo fmt --package chromaweave -- --check
          cargo fmt --manifest-path ios/RustBridge/Cargo.toml --package cw-codec-ffi -- --check
      - name: Rust and bridge lint
        if: matrix.toolchain == 'stable'
        run: |
          cargo clippy --locked --all-targets --features tools -- -D warnings
          cargo clippy --locked --manifest-path ios/RustBridge/Cargo.toml --all-targets -- -D warnings
      - name: Core codec and public corpus
        run: cargo test --release --locked --no-default-features
      - name: CLI, QR and synthetic captures
        run: cargo test --release --locked --features tools --all-targets
      - name: C bridge
        run: cargo test --release --locked --manifest-path ios/RustBridge/Cargo.toml

      - name: Vendored Reed–Solomon arithmetic
        run: cargo test --release --locked --manifest-path vendor/reed-solomon/Cargo.toml

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon
        run: |
          CW_HOST_ARCH=$(uname -m)
          if [ "$CW_HOST_ARCH" != arm64 ]; then
            echo "::error::ARM64 iOS simulator tests require arm64; runner reported $CW_HOST_ARCH." >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: Fresh and repeated simulator bridge builds
        run: |
          ./ios/build-codec.sh --simulator-only
          ./ios/build-codec.sh --simulator-only
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          CW_SIMULATOR_ID=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as source:
              devices = json.load(source)["devices"]
          print(next(device["udid"] for runtime in devices.values() for device in runtime if device["name"].startswith("iPhone")))
          PY
          )
          echo "id=$CW_SIMULATOR_ID" >> "$GITHUB_OUTPUT"
      - name: Debug hosted tests
        run: >-
          xcodebuild -project ios/ChromaWeave.xcodeproj -scheme ChromaWeave
          -configuration Debug -sdk iphonesimulator
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -derivedDataPath ios/build/ci-debug CODE_SIGNING_ALLOWED=NO test
      - name: Release simulator build
        run: >-
          xcodebuild -project ios/ChromaWeave.xcodeproj -scheme ChromaWeave
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build/ci-release CODE_SIGNING_ALLOWED=NO build
