[package]
name = "chromaweave"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"
description = "Luminance and spatial multiplexed visual data codes"
readme = "README.md"
publish = false

[features]
default = []
tools = ["dep:clap", "dep:qrcode", "dep:quircs", "dep:rand", "dep:rand_chacha", "dep:rxing", "dep:serde_json", "image/png", "image/jpeg"]

[[bin]]
name = "chromaweave"
path = "src/main.rs"
required-features = ["tools"]

[[test]]
name = "qr_baseline"
required-features = ["tools"]

[[test]]
name = "scanner_capture"
required-features = ["tools"]

[[test]]
name = "registered_capture"
required-features = ["tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"], optional = true }
crc32fast = "1.5"
image = { version = "0.25", default-features = false }
qrcode = { version = "0.14.1", default-features = false, optional = true }
quircs = { version = "0.10.3", optional = true }
rand = { version = "0.9", optional = true }
rand_chacha = { version = "0.9", optional = true }
reed-solomon = { version = "0.2.1", path = "vendor/reed-solomon" }
rxing = { version = "0.9.3", default-features = false, features = ["qrcode", "decoders", "encoding_rs"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
sha2 = "0.10.9"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = "0.9"
rand_chacha = "0.9"
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
